<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin — Form settings</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header>
    <h1>mmldigi-forms admin</h1>
    <nav>
      <a href="/admin/">Submissions</a>
      <a href="/admin/forms.html">Forms</a>
      <a href="/admin/auth/logout">Log out</a>
    </nav>
  </header>
  <main>
    <p><a href="/admin/forms.html" class="muted">← Back to forms</a></p>
    <h2 id="title" style="font-size:18px;margin:0 0 16px;">Loading...</h2>
    <div id="form" style="display:none;">
      <label style="display:block;margin-bottom:16px;">
        <span class="muted" style="display:block;margin-bottom:4px;">Notify emails (comma-separated)</span>
        <input id="notify-emails" style="width:100%;background:#14161A;color:#F4F4F7;border:1px solid #2A2D33;padding:8px;border-radius:4px;">
      </label>
      <label style="display:block;margin-bottom:16px;">
        <span class="muted" style="display:block;margin-bottom:4px;">Webhooks (JSON array of {id, url, payload_template})</span>
        <textarea id="webhooks-json" style="width:100%;height:200px;background:#14161A;color:#F4F4F7;border:1px solid #2A2D33;padding:8px;border-radius:4px;font-family:monospace;font-size:12px;"></textarea>
      </label>
      <div class="filters">
        <label class="muted">Score threshold: <input id="score-threshold" type="number" style="width:80px;background:#14161A;color:#F4F4F7;border:1px solid #2A2D33;padding:6px;border-radius:4px;"></label>
        <label class="muted">Spam min time (ms): <input id="spam-min-time" type="number" style="width:80px;background:#14161A;color:#F4F4F7;border:1px solid #2A2D33;padding:6px;border-radius:4px;"></label>
        <label class="muted">Rate limit / min: <input id="rate-limit" type="number" style="width:60px;background:#14161A;color:#F4F4F7;border:1px solid #2A2D33;padding:6px;border-radius:4px;"></label>
      </div>
      <button class="btn" id="save-btn" style="margin-top:16px;">Save settings</button>
      <p id="status" class="muted"></p>
    </div>
  </main>
  <script>
    const formId = new URLSearchParams(window.location.search).get('id');
    async function load() {
      if (!formId) { document.getElementById('title').textContent = 'No id'; return; }
      const r = await fetch(`/admin/api/forms/${encodeURIComponent(formId)}/settings`, { credentials: 'include' });
      if (r.status === 401) { window.location = '/admin/login.html'; return; }
      const s = await r.json();
      document.getElementById('title').textContent = `Settings — ${formId}`;
      document.getElementById('form').style.display = 'block';
      document.getElementById('notify-emails').value = s.notifyEmails.join(', ');
      document.getElementById('webhooks-json').value = JSON.stringify(s.webhooks, null, 2);
      document.getElementById('score-threshold').value = s.scoreThreshold;
      document.getElementById('spam-min-time').value = s.spamMinTimeMs;
      document.getElementById('rate-limit').value = s.rateLimitPerIp;
    }
    document.getElementById('save-btn').addEventListener('click', async () => {
      let webhooks;
      try { webhooks = JSON.parse(document.getElementById('webhooks-json').value); }
      catch (e) { document.getElementById('status').textContent = `Invalid webhooks JSON: ${e.message}`; return; }
      const payload = {
        notifyEmails: document.getElementById('notify-emails').value.split(',').map(s => s.trim()).filter(Boolean),
        webhooksJson: webhooks,
        scoreThreshold: parseInt(document.getElementById('score-threshold').value, 10),
        spamMinTimeMs: parseInt(document.getElementById('spam-min-time').value, 10),
        rateLimitPerIp: parseInt(document.getElementById('rate-limit').value, 10),
      };
      const r = await fetch(`/admin/api/forms/${encodeURIComponent(formId)}/settings`, {
        method: 'PUT', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      document.getElementById('status').textContent = r.ok ? 'Saved.' : `Error: ${r.status}`;
    });
    load();
  </script>
</body>
</html>
